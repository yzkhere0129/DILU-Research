[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dilu-amgx"
version = "1.0.0"
description = "JAX FFI bindings for NVIDIA AMGx 2.5.0 — production-grade sparse solver hot-path for LPBF additive-manufacturing CFD."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "DILU-Research contributors" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "jax>=0.4",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "scipy>=1.10",  # spsolve as ground truth
]
benchmarks = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.urls]
"Source"         = "https://github.com/Shengfeng233/JAX-LaserAM"
"Reproducibility" = "https://github.com/Shengfeng233/JAX-LaserAM/blob/main/REPRODUCE.md"

# -----------------------------------------------------------------------------
# Package layout
# -----------------------------------------------------------------------------
# Install name: `dilu_amgx` (PyPI / pip install dilu-amgx)
# Import name:  `from dilu_amgx import Plan, amgx_solve, amgx_solve_with_refinement, ...`
#
# In monorepo development (this DILU-Research tree), the legacy import path
# `from dilu.amgx.python import ...` continues to work because PEP 420 lets
# `dilu` and `dilu.amgx` act as implicit namespace packages. After installing
# the wheel, prefer the short name.
# -----------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "dilu_amgx" = "python" }
packages = ["dilu_amgx"]
include-package-data = true

[tool.setuptools.package-data]
# Ship JSON configs and the prebuilt shared library if present at install time
# (CI / wheel builds should call ./build.sh first so libdilu_amgx.so lands in
# python/ — currently it's expected at ../build/libdilu_amgx.so per
# registration.py's lookup. Future: switch to scikit-build-core.)
"dilu_amgx" = ["py.typed", "*.json"]
